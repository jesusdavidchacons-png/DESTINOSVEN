<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Visor VR 360° Nativo - Meta Quest 3</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
    #setup-panel {
      position: fixed; inset: 0; z-index: 9999; background: rgba(10, 15, 28, 0.96);
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center;
    }
    .box { background: #1e293b; padding: 24px; border-radius: 16px; max-width: 520px; width: 100%; margin: 12px 0; }
    .row { display: flex; justify-content: space-between; align-items: center; margin: 14px 0; text-align: left; }
    button.start {
      margin-top: 20px; padding: 18px 36px; font-size: 1.2rem; font-weight: bold;
      background: #0284c7; color: white; border: none; border-radius: 14px; cursor: pointer;
    }
    .ok { color: #4ade80; font-weight: bold; }
    .pending { color: #fbbf24; }
    #debug-bar {
      position: fixed; top: 10px; left: 10px; z-index: 10000; background: rgba(0,0,0,0.8);
      padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; color: #38bdf8;
    }
  </style>
</head>
<body>

  <div id="debug-bar">Estado: Esperando inicio...</div>

  <div id="setup-panel">
    <h1>Configuración del Tótem VR</h1>
    <p style="color:#94a3b8; margin-top:6px;">Carga los videos desde los lentes una sola vez (quedan guardados offline).</p>

    <div class="box">
      <div class="row">
        <div>
          <strong>1. coloniatovar.mp4</strong><br/>
          <span id="st-coloniatovar" class="pending">Pendiente de cargar</span>
        </div>
        <input type="file" accept="video/mp4" onchange="guardarVideo('coloniatovar', this.files[0])" />
      </div>

      <div class="row">
        <div>
          <strong>2. bahíadecata.mp4</strong><br/>
          <span id="st-bahíadecata" class="pending">Pendiente de cargar</span>
        </div>
        <input type="file" accept="video/mp4" onchange="guardarVideo('bahíadecata', this.files[0])" />
      </div>
    </div>

    <div id="peer-status" style="margin: 10px 0; color: #38bdf8;">Iniciando receptor inalámbrico...</div>
    <button class="start" onclick="iniciarExperienciaVR()">INICIAR MODO VR EN TÓTEM</button>
  </div>

  <video id="video-360" loop playsinline webkit-playsinline crossorigin="anonymous" style="display:none;"></video>

  <script>
    const VISOR_ID = 'barbarie-totem-quest3-01';
    const DB_NAME = 'TotemVR_Videos';
    const videoEl = document.getElementById('video-360');
    const debugBar = document.getElementById('debug-bar');

    let db;
    let videoActual = null;
    let currentBlobUrl = null;
    let xrSession = null;
    let xrRefSpace = null;
    let mediaBinding = null;
    let equirectLayer = null;

    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore('videos');
    req.onsuccess = e => {
      db = e.target.result;
      verificarVideosGuardados();
    };

    function guardarVideo(key, file) {
      if (!file || !db) return;
      const tx = db.transaction('videos', 'readwrite');
      tx.objectStore('videos').put(file, key);
      tx.oncomplete = () => {
        document.getElementById('st-' + key).textContent = 'Guardado (' + (file.size / 1048576).toFixed(0) + ' MB)';
        document.getElementById('st-' + key).className = 'ok';
      };
    }

    function verificarVideosGuardados() {
      ['coloniatovar', 'bahíadecata'].forEach(key => {
        const tx = db.transaction('videos', 'readonly');
        const getReq = tx.objectStore('videos').get(key);
        getReq.onsuccess = () => {
          if (getReq.result) {
            document.getElementById('st-' + key).textContent = 'Listo en memoria local';
            document.getElementById('st-' + key).className = 'ok';
          }
        };
      });
    }

    function actualizarCapaNativa() {
      if (!xrSession || !mediaBinding || !xrRefSpace || videoEl.readyState < 1) return;

      try {
        equirectLayer = mediaBinding.createEquirectLayer(videoEl, {
          space: xrRefSpace,
          layout: 'mono',
          radius: 0,
          // Cierra por completo la costura vertical (360° completos + micro-solape)
          centralHorizontalAngle: Math.PI * 2 + 0.002,
          upperVerticalAngle: Math.PI / 2,
          lowerVerticalAngle: -Math.PI / 2
        });

        // Orientación inicial -90 grados en Y (ajusta -90 si quieres mover la costura atrás del espectador)
        const halfAngle = (-90 * Math.PI / 180) / 2;
        equirectLayer.transform = new XRRigidTransform(
          { x: 0, y: 0, z: 0 },
          { x: 0, y: Math.sin(halfAngle), z: 0, w: Math.cos(halfAngle) }
        );

        xrSession.updateRenderState({
          layers: [equirectLayer]
        });

        debugBar.textContent = 'ACTIVO: Capa Nativa Sin Costura (' + videoEl.videoWidth + 'x' + videoEl.videoHeight + ')';
        debugBar.style.color = '#4ade80';
      } catch (err) {
        debugBar.textContent = 'ERROR Capa Nativa: ' + err.message;
        debugBar.style.color = '#f87171';
      }
    }

    function reproducirDesdeDB(key) {
      if (!db || videoActual === key) return;

      const tx = db.transaction('videos', 'readonly');
      const getReq = tx.objectStore('videos').get(key);

      getReq.onsuccess = () => {
        const blob = getReq.result;
        if (!blob) return;

        videoEl.pause();
        if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);

        currentBlobUrl = URL.createObjectURL(blob);
        videoEl.src = currentBlobUrl;
        videoEl.load();

        videoEl.onloadedmetadata = () => {
          actualizarCapaNativa();
        };

        videoEl.play().then(() => {
          videoActual = key;
        }).catch(() => {
          videoEl.muted = true;
          videoEl.play().then(() => {
            videoActual = key;
            videoEl.muted = false;
          });
        });
      };
    }

    const peer = new Peer(VISOR_ID);
    peer.on('open', () => {
      document.getElementById('peer-status').textContent = 'Visor listo para recibir órdenes de la tablet';
    });
    peer.on('connection', conn => {
      conn.on('data', data => {
        if (data.action === 'PLAY' && data.videoId) {
          reproducirDesdeDB(data.videoId);
        } else if (data.action === 'PAUSE') {
          videoEl.paused ? videoEl.play() : videoEl.pause();
        } else if (data.action === 'RESTART') {
          videoEl.currentTime = 0;
          videoEl.play();
        }
      });
    });

    async function iniciarExperienciaVR() {
      document.getElementById('setup-panel').style.display = 'none';
      videoEl.play().catch(() => {});
      reproducirDesdeDB('coloniatovar');

      if (!navigator.xr) {
        debugBar.textContent = 'WebXR no disponible en este navegador';
        return;
      }

      try {
        // 'local' centra la esfera directo a nivel de los ojos al iniciar, sin depender del suelo ni del Guardian
        xrSession = await navigator.xr.requestSession('immersive-vr', {
          requiredFeatures: ['local', 'layers']
        });

        xrRefSpace = await xrSession.requestReferenceSpace('local');
        mediaBinding = new XRMediaBinding(xrSession);

        if (videoEl.readyState >= 1) {
          actualizarCapaNativa();
        }

        const onXRFrame = (time, frame) => {
          if (xrSession) xrSession.requestAnimationFrame(onXRFrame);
        };
        xrSession.requestAnimationFrame(onXRFrame);

        xrSession.addEventListener('end', () => {
          xrSession = null;
          equirectLayer = null;
          document.getElementById('setup-panel').style.display = 'flex';
        });

      } catch (err) {
        debugBar.textContent = 'Fallo al iniciar sesión XR: ' + err.message;
        debugBar.style.color = '#f87171';
      }
    }
  </script>
</body>
</html>
