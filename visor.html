<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Visor VR 360° Nativo - Meta Quest 3</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    #setup-panel {
      position: fixed; inset: 0; z-index: 9999; background: rgba(10, 15, 28, 0.96);
      color: #fff; font-family: system-ui, sans-serif; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 30px; text-align: center;
    }
    .box { background: #1e293b; padding: 24px; border-radius: 16px; max-width: 520px; width: 100%; margin: 12px 0; }
    .row { display: flex; justify-content: space-between; align-items: center; margin: 14px 0; text-align: left; }
    button.start {
      margin-top: 20px; padding: 18px 36px; font-size: 1.2rem; font-weight: bold;
      background: #0284c7; color: white; border: none; border-radius: 14px; cursor: pointer;
    }
    .ok { color: #4ade80; font-weight: bold; }
    .pending { color: #fbbf24; }
  </style>
</head>
<body>

  <div id="setup-panel">
    <h1>Configuración del Tótem VR</h1>
    <p style="color:#94a3b8; margin-top:6px;">Carga los videos desde los lentes una sola vez (quedan guardados offline).</p>

    <div class="box">
      <div class="row">
        <div>
          <strong>1. coloniatovar.mp4</strong><br/>
          <span id="st-coloniatovar" class="pending">Pendiente de cargar</span>
        </div>
        <input type="file" accept="video/mp4" onchange="guardarVideo('coloniatovar', this.files[0])" />
      </div>

      <div class="row">
        <div>
          <strong>2. bahíadecata.mp4</strong><br/>
          <span id="st-bahíadecata" class="pending">Pendiente de cargar</span>
        </div>
        <input type="file" accept="video/mp4" onchange="guardarVideo('bahíadecata', this.files[0])" />
      </div>
    </div>

    <div id="peer-status" style="margin: 10px 0; color: #38bdf8;">Iniciando receptor inalámbrico...</div>
    <button class="start" onclick="iniciarExperienciaVR()">INICIAR MODO VR EN TÓTEM</button>
  </div>

  <!-- Activamos la característica 'layers' de WebXR -->
  <a-scene 
    id="vr-scene" 
    webxr="optionalFeatures: layers; referenceSpaceType: local-floor;"
    vr-mode-ui="enabled: true" 
    loading-screen="enabled: false"
    renderer="antialias: true; highRefreshRate: true; foveationLevel: 0;">
    
    <a-assets>
      <video id="video-360" loop="true" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline></video>
    </a-assets>

    <!-- Esfera de respaldo (solo visible si no hay capa nativa WebXR o en PC) -->
    <a-videosphere 
      id="esfera-fallback" 
      src="#video-360" 
      radius="100"
      rotation="0 -90 0" 
      segments-width="128" 
      segments-height="64"
      material="shader: flat; npot: true; side: back;">
    </a-videosphere>

    <a-camera look-controls="reverseMouseDrag: false" wasd-controls-enabled="false"></a-camera>
  </a-scene>

  <script>
    const VISOR_ID = 'barbarie-totem-quest3-01';
    const DB_NAME = 'TotemVR_Videos';
    const videoEl = document.getElementById('video-360');
    const sceneEl = document.getElementById('vr-scene');
    const esferaFallback = document.getElementById('esfera-fallback');

    let db;
    let videoActual = null;
    let currentBlobUrl = null;
    let equirectLayer = null;
    let xrSessionActiva = null;

    // 1. Limpieza de textura para el modo respaldo (PC / sin layers)
    function limpiarTexturaFallback() {
      const mesh = esferaFallback.getObject3D('mesh');
      if (mesh && mesh.material && mesh.material.map) {
        const tex = mesh.material.map;
        tex.generateMipmaps = false;
        tex.minFilter = THREE.LinearFilter;
        tex.magFilter = THREE.LinearFilter;
        tex.wrapS = THREE.ClampToEdgeWrapping;
        tex.wrapT = THREE.ClampToEdgeWrapping;
        tex.needsUpdate = true;
        mesh.material.needsUpdate = true;
      }
    }
    videoEl.addEventListener('playing', limpiarTexturaFallback);

    // 2. Montaje de la capa nativa WebXR Equirect Layer (Calidad nativa Quest 3)
    async function montarCapaNativaVR() {
      const renderer = sceneEl.renderer;
      if (!renderer || !renderer.xr) return;

      const session = renderer.xr.getSession();
      if (!session || typeof XRMediaBinding === 'undefined') return;

      xrSessionActiva = session;

      try {
        const refSpace = renderer.xr.getReferenceSpace() || await session.requestReferenceSpace('local-floor');
        const mediaBinding = new XRMediaBinding(session);

        // Creamos la capa equirectangular directa desde la etiqueta <video>
        equirectLayer = mediaBinding.createEquirectLayer(videoEl, {
          space: refSpace,
          layout: 'mono', // Cambia a 'stereo-top-bottom' o 'stereo-left-right' si tu video es 3D estereoscópico
          radius: 0       // 0 = esfera al infinito (cero paralaje y cero distorsión en polos)
        });

        // Alineamos la orientación inicial igual que rotation="0 -90 0"
        const halfAngle = (-90 * Math.PI / 180) / 2;
        equirectLayer.transform = new XRRigidTransform(
          { x: 0, y: 0, z: 0 },
          { x: 0, y: Math.sin(halfAngle), z: 0, w: Math.cos(halfAngle) }
        );

        // Inyectamos la capa nativa al compositor de las Quest 3
        const baseLayer = session.renderState.baseLayer;
        session.updateRenderState({
          layers: [equirectLayer, baseLayer]
        });

        // Ocultamos la esfera 3D de WebGL para que la GPU no trabaje doble
        esferaFallback.setAttribute('visible', 'false');
      } catch (err) {
        console.warn('No se pudo activar WebXR Layer, usando esfera WebGL optimizada:', err);
        esferaFallback.setAttribute('visible', 'true');
      }
    }

    sceneEl.addEventListener('enter-vr', () => {
      // Subimos escala de renderizado por si cae en modo fallback
      if (sceneEl.renderer && sceneEl.renderer.xr) {
        sceneEl.renderer.xr.setFramebufferScaleFactor(1.5);
      }
      // Si el video ya tiene metadata cargada, montamos la capa nativa de inmediato
      if (videoEl.readyState >= 1) {
        montarCapaNativaVR();
      } else {
        videoEl.addEventListener('loadedmetadata', montarCapaNativaVR, { once: true });
      }
    });

    sceneEl.addEventListener('exit-vr', () => {
      equirectLayer = null;
      xrSessionActiva = null;
      esferaFallback.setAttribute('visible', 'true');
    });

    // 3. Base de datos local IndexedDB
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore('videos');
    req.onsuccess = e => {
      db = e.target.result;
      verificarVideosGuardados();
    };

    function guardarVideo(key, file) {
      if (!file || !db) return;
      const tx = db.transaction('videos', 'readwrite');
      tx.objectStore('videos').put(file, key);
      tx.oncomplete = () => {
        document.getElementById('st-' + key).textContent = 'Guardado en memoria (' + (file.size / 1048576).toFixed(0) + ' MB)';
        document.getElementById('st-' + key).className = 'ok';
      };
    }

    function verificarVideosGuardados() {
      ['coloniatovar', 'bahíadecata'].forEach(key => {
        const tx = db.transaction('videos', 'readonly');
        const getReq = tx.objectStore('videos').get(key);
        getReq.onsuccess = () => {
          if (getReq.result) {
            document.getElementById('st-' + key).textContent = 'Listo en memoria local';
            document.getElementById('st-' + key).className = 'ok';
          }
        };
      });
    }

    function reproducirDesdeDB(key) {
      if (!db || videoActual === key) return;

      const tx = db.transaction('videos', 'readonly');
      const getReq = tx.objectStore('videos').get(key);

      getReq.onsuccess = () => {
        const blob = getReq.result;
        if (!blob) return;

        videoEl.pause();
        if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);

        currentBlobUrl = URL.createObjectURL(blob);
        videoEl.src = currentBlobUrl;
        videoEl.load();

        // Si ya estamos dentro de VR y se cambia de video, actualizamos la capa nativa al cargar metadata
        if (xrSessionActiva && !equirectLayer) {
          videoEl.addEventListener('loadedmetadata', montarCapaNativaVR, { once: true });
        }

        const playPromise = videoEl.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            videoActual = key;
          }).catch(() => {
            videoEl.muted = true;
            videoEl.play().then(() => {
              videoActual = key;
              videoEl.muted = false;
            });
          });
        }
      };
    }

    // 4. Control inalámbrico desde la tablet (PeerJS)
    const peer = new Peer(VISOR_ID);

    peer.on('open', () => {
      document.getElementById('peer-status').textContent = 'Visor listo para recibir órdenes de la tablet';
    });

    peer.on('connection', conn => {
      conn.on('data', data => {
        if (data.action === 'PLAY' && data.videoId) {
          reproducirDesdeDB(data.videoId);
        } else if (data.action === 'PAUSE') {
          videoEl.paused ? videoEl.play() : videoEl.pause();
        } else if (data.action === 'RESTART') {
          videoEl.currentTime = 0;
          videoEl.play();
        }
      });
    });

    function iniciarExperienciaVR() {
      document.getElementById('setup-panel').style.display = 'none';
      videoEl.play().catch(() => {});
      reproducirDesdeDB('coloniatovar');
      if (sceneEl.enterVR) sceneEl.enterVR();
    }
  </script>
</body>
</html>
